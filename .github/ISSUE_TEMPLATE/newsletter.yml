name: Newsletter Edition
description: Create a new NL-RSE Community Newsletter issue
title: "Newsletter - <Month Year>"
labels: ["newsletter"]

body:
  - type: markdown
    attributes:
      value: |
        ## NL-RSE Newsletter Planning

        Use this issue to coordinate the next newsletter edition.

        Community members: please comment below with:
        - events and dates for your calendar
        - community news
        - job opportunities
        - blog posts, tools, resources

        Please include links and a short description where possible.

  - type: input
    id: edition
    attributes:
      label: Newsletter edition
      description: Month and year of this newsletter
      placeholder: "July 2026"
    validations:
      required: true

  - type: input
    id: publication-date
    attributes:
      label: Planned publication date
      description: When do we expect to publish?
      placeholder: "2026-07-31"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Newsletter status
      options:
        - Collecting content
        - Closed for content
        - Published
      default: 0
    validations:
      required: true

  - type: textarea
    id: intro
    attributes:
      label: Intro / editorial note
      description: Draft intro for this edition
      placeholder: |
        Welcome to the July 2026 edition of the NL-RSE Community Newsletter...
      render: markdown

  - type: textarea
    id: dates-for-calendar
    attributes:
      label: Dates for your calendar
      description: Events, conferences, deadlines, workshops, calls, etc.
      placeholder: |
        - Event name (**date**) — short description + link
      render: markdown

  - type: textarea
    id: news
    attributes:
      label: News
      description: Community updates, announcements, reports, opportunities, etc.
      placeholder: |
        - News item — short summary + link
      render: markdown

  - type: textarea
    id: job-postings
    attributes:
      label: Job postings
      description: Relevant research software, research engineering, data, or open science jobs
      placeholder: |
        - Job title — organisation + short summary + link
      render: markdown

  - type: textarea
    id: blog-posts-tools-more
    attributes:
      label: Blog posts, tools & more
      description: Interesting articles, tools, podcasts, videos, guides, resources, etc.
      placeholder: |
        - Resource — short description + link
      render: markdown

  - type: textarea
    id: editorial-checklist
    attributes:
      label: Editorial checklist
      value: |
        - [x] Open newsletter issue
        - [ ] Create newsletter branch `newsletter-<yyyy>-<mm>`
        - [ ] Collect community input from issue comments
        - [ ] Update newsletter status to **Closed for content**
        - [ ] Draft newsletter content. Proofread checking dates and links.
        - [ ] Open pull request to merge newsletter branch into `main`
        - [ ] Notify the core team that the PR is ready for review
        - [ ] Resolve review comments and merge PR.
        - [ ] Update newsletter status to **Published**
        - [ ] Send newsletter to mailing list
        - [ ] Share announcement on UKRSE Slack Netherlands channel
        - [ ] Share announcement on LinkedIn
      render: markdown

  - type: markdown
    attributes:
      value: |
        ## Contributing

        Community members: add suggestions in the comments below.

        Helpful format:

        **Category:** Calendar / News / Jobs / Blog posts & tools  
        **Title:**  
        **Link:**  
        **Why it matters to the NL-RSE community:**